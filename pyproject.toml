[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgate"
version = "0.1.0"
description = "See everything a repository will run when you open, install or build it: IDE tasks, AI agent hooks, npm lifecycle scripts, dev containers and more."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kirtan Bhatt" }]
keywords = ["security", "supply-chain", "vscode", "claude-code", "devcontainer", "npm", "sarif", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kirtanbhatt10/trustgate"
Issues = "https://github.com/kirtanbhatt10/trustgate/issues"

[project.scripts]
trustgate = "trustgate.cli:main"

[tool.setuptools]
packages = ["trustgate", "trustgate.checks"]
